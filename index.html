<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'; connect-src 'none'">
  <title>Moeezland Internet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <img src="logo.png" alt="">
      <span>Moeezland Internet</span>
    </div>
    <nav class="navigation" aria-label="Browser navigation">
      <button id="back" title="Back" aria-label="Back" disabled>←</button>
      <button id="forward" title="Forward" aria-label="Forward" disabled>→</button>
      <button id="reload" title="Reload" aria-label="Reload">↻</button>
      <button id="home" title="Home" aria-label="Home">⌂</button>
    </nav>
    <form id="address-form">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="address" type="text" placeholder="Search Google or enter a website address" autocomplete="off" spellcheck="false" aria-label="Search or enter address">
      <button type="submit">Go</button>
    </form>
  </header>
  <div id="status" role="status" aria-live="polite">Starting browser…</div>
  <script src="renderer.js"></script>
</body>
</html>
